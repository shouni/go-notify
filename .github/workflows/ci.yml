# The CI itself lives in shouni/workflows; its README explains the job layout and the tagging practice.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      # Notification bodies are external input, and both escaping and splitting are hand-written scans, so fuzz on every run.
      fuzz-targets: "./slack#FuzzFormatMarkdown ./slack#FuzzSplitSectionText"
      fuzz-time: 60s
