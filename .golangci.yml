version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - exhaustive
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
    exhaustive:
      # Check map literals as well as switches. What actually branches on
      # notify.Level is slack's levelColors, which is a map. A level added
      # without an entry would look up as an empty string and pass silently,
      # so without this the notification would go out uncoloured.
      check:
        - switch
        - map

formatters:
  enable:
    - gofmt
    - goimports
